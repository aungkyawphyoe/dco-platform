<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoX — subscription product icons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=IBM+Plex+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #101b22;
        --brass: #876800;
        --gold: #feca1f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: transparent;
      }

      .canvas {
        position: relative;
        width: 800px;
        height: 800px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          -32deg,
          rgba(255, 255, 255, 0) 0 26px,
          rgba(255, 255, 255, 0.4) 26px 28px
        );
        opacity: 0.3;
      }

      /* ---- Lite: light garage day ---- */
      .canvas.lite {
        background:
          radial-gradient(460px 380px at 85% -5%, rgba(254, 202, 31, 0.34), transparent 64%),
          radial-gradient(400px 340px at -5% 105%, rgba(135, 104, 0, 0.1), transparent 62%),
          linear-gradient(160deg, #f7f9fb 0%, #e8edf3 100%);
        color: var(--ink);
      }

      /* ---- Standard: night garage, premium ink ---- */
      .canvas.standard {
        background:
          radial-gradient(460px 380px at 85% -5%, rgba(254, 202, 31, 0.25), transparent 64%),
          radial-gradient(420px 360px at -5% 105%, rgba(254, 202, 31, 0.08), transparent 62%),
          linear-gradient(160deg, #152029 0%, #0c141a 100%);
        color: #f1f3f8;
      }

      .canvas.standard::after {
        content: "";
        position: absolute;
        inset: 22px;
        border: 2.5px solid rgba(254, 202, 31, 0.55);
        border-radius: 34px;
        pointer-events: none;
      }

      .logo-tile {
        position: relative;
        z-index: 2;
        width: 124px;
        height: 124px;
        background: #fff;
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 28px -8px rgba(16, 27, 34, 0.35);
      }

      .logo {
        width: 92px;
        height: 92px;
      }

      .tier {
        position: relative;
        z-index: 2;
        margin-top: 34px;
        font-family: "Barlow", sans-serif;
        font-weight: 700;
        font-size: 118px;
        line-height: 1;
        letter-spacing: -2px;
      }

      .standard .tier {
        color: var(--gold);
      }

      .features {
        position: relative;
        z-index: 2;
        margin-top: 26px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.2px;
        opacity: 0.82;
      }

      .features .dot {
        margin: 0 14px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="canvas lite" id="c">
      <div class="logo-tile">
        <img class="logo" id="logo" src="assets/logo.png" alt="AutoX" />
      </div>
      <div class="tier" id="tier">Lite</div>
      <div class="features" id="features"></div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const plan = params.get("plan") === "standard" ? "standard" : "lite";
      const canvas = document.getElementById("c");

      canvas.classList.remove("lite", "standard");
      canvas.classList.add(plan);

      document.getElementById("tier").textContent = plan === "standard" ? "Standard" : "Lite";
      document.getElementById("features").innerHTML =
        plan === "standard"
          ? "10 vehicles<span class='dot'>·</span>Unlimited sharing"
          : "3 vehicles<span class='dot'>·</span>3 shares";
    </script>
  </body>
</html>
