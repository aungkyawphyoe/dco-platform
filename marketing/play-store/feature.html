<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoX — Play feature graphic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #101b22;
        --ink-2: #4f606c;
        --brass: #876800;
        --page-1: #f7f9fb;
        --page-2: #e8edf3;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }

      .canvas {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background:
          radial-gradient(520px 400px at 92% -10%, rgba(254, 202, 31, 0.38), transparent 64%),
          radial-gradient(420px 360px at -6% 110%, rgba(135, 104, 0, 0.1), transparent 62%),
          linear-gradient(160deg, var(--page-1) 0%, var(--page-2) 100%);
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          -32deg,
          rgba(255, 255, 255, 0) 0 28px,
          rgba(255, 255, 255, 0.35) 28px 30px
        );
        opacity: 0.35;
      }

      .text {
        position: absolute;
        left: 64px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        max-width: 560px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .brand .name {
        font-family: "Barlow", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.4px;
      }

      h1 {
        margin-top: 22px;
        font-family: "Barlow", sans-serif;
        font-weight: 600;
        font-size: 54px;
        line-height: 1.08;
        letter-spacing: -1px;
      }

      .sub {
        margin-top: 14px;
        font-size: 21px;
        line-height: 1.45;
        color: var(--ink-2);
        max-width: 470px;
      }

      .pills {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }

      .pill {
        font-size: 16px;
        font-weight: 500;
        color: var(--brass);
        background: rgba(254, 202, 31, 0.16);
        border: 1.5px solid rgba(135, 104, 0, 0.35);
        border-radius: 999px;
        padding: 7px 16px;
      }

      .phones {
        position: absolute;
        right: -40px;
        bottom: -120px;
        z-index: 1;
        width: 560px;
        height: 620px;
      }

      .phones::before {
        content: "";
        position: absolute;
        inset: 40px 20px 60px 60px;
        background: radial-gradient(closest-side, rgba(254, 202, 31, 0.4), transparent 76%);
        filter: blur(14px);
      }

      .phone {
        position: absolute;
        background: var(--ink);
        border-radius: 40px;
        padding: 9px;
        box-shadow:
          0 36px 72px -20px rgba(16, 27, 34, 0.45),
          0 0 0 1.5px rgba(16, 27, 34, 0.18);
      }

      .phone img {
        display: block;
        border-radius: 32px;
      }

      .phone.back {
        width: 250px;
        right: 258px;
        bottom: 30px;
        transform: rotate(-8deg);
        opacity: 0.96;
      }

      .phone.back img {
        width: 232px;
        height: auto;
      }

      .phone.front {
        width: 292px;
        right: 20px;
        bottom: -36px;
        transform: rotate(4deg);
      }

      .phone.front img {
        width: 274px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="text">
        <div class="brand">
          <img src="assets/logo.png" alt="AutoX" />
          <span class="name">AutoX</span>
        </div>
        <h1>Your digital garage</h1>
        <p class="sub">
          Fuel, maintenance, expenses and more — every vehicle you own, in one calm app.
        </p>
        <div class="pills">
          <span class="pill">Works offline</span>
          <span class="pill">Multi-vehicle</span>
          <span class="pill">Smart reminders</span>
        </div>
      </div>
      <div class="phones">
        <div class="phone back">
          <img src="assets/app-garage-light.webp" alt="" />
        </div>
        <div class="phone front">
          <img src="assets/app-dashboard-light.webp" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
