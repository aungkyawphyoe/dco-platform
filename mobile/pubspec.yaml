name: dco_mobile
description: DCO owner app — digital garage, offline-first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  path_provider: ^2.1.6
  uuid: ^4.6.0
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/dco-logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/dco-logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/dco-logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/branding/dco-logo.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/dco-logo.png
